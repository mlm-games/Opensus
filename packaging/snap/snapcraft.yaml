name: opensus
version: '0.1.0'
summary: OpenSuspect-inspired social deduction game (Bevy)
description: |
  OpenSuspect-inspired social deduction game. Migrated from the
  Godot Opensus project onto my-ecosystem-template-bevy.
grade: stable
confinement: strict

apps:
