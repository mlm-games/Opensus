id: com.mlm-games.opensus
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: opensus-desktop
modules:
  - name: opensus-desktop
    buildsystem: simple
    build-commands:
      - cargo build --release
      - install -Dm755 target/release/opensus-desktop /app/bin/opensus-desktop
    sources:
      - type: dir
        path: .
