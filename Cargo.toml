[package]
name = "opensus"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
description = "social deduction game (migrated from the Godot version)"
repository = "https://github.com/mlm-games/opensus"
readme = "README.md"
keywords = ["gamedev", "social-deduction", "multiplayer", "repose"]
categories = ["game-development"]
rust-version = "1.96"
default-run = "opensus-desktop"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "opensus-desktop"
path = "src/main.rs"

[features]
default = ["dev_native"]
dev = []
dev_native = ["dev"]
networking-native = [
    "dep:renet2",
    "dep:renet2_netcode",
    "dep:bincode",
]

[dependencies]
# Engine; [patch.crates-io] below redirects these to the sibling checkouts.
repame-sim = "0.3"
repame-shell = "0.3"
repame-fx = "0.3"
repame-audio = "0.3"
# Direct dep: bevy derive macros expand to `bevy_ecs::` paths, so every
# game crate names it explicitly. Must unify with repame-sim's 0.19.
bevy_ecs = "0.19"
# Same glam as repame: shared math types must unify to one version.
glam = "0.33"
repose-core = "0.31"
repose-ui = "0.31"
repose-text = "0.31"
repose-canvas = "0.31"
repose-material = "0.31"
game-utils = "0.4"
game-utils-repame = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
bincode = { version = "1.3", optional = true }
log = "0.4"
anyhow = "1"
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
renet2 = { version = "0.17", optional = true, default-features = false }
renet2_netcode = { version = "0.17", optional = true, default-features = false, features = ["native_transport"] }

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30", features = ["android-native-activity"] }

[target.'cfg(all(target_family = "wasm", any(target_os = "unknown", target_os = "none")))'.dependencies]
wasm-bindgen = "0.2"
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom_03 = { version = "0.3", features = ["wasm_js"], package = "getrandom" }
getrandom_02 = { version = "0.2", features = ["js"], package = "getrandom" }

[package.metadata.android]
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.wgpu-types]
debug-assertions = false

[profile.release]
codegen-units = 1
lto = "thin"

[profile.web-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"

[patch.crates-io]
# Sibling checkouts win over the published crates above; their versions must
# satisfy the requirements above. game-utils-repame's published 0.4.0 still
# tracks repame-sim 0.2: uncomment its line to pick up the 0.3 line locally.
# game-utils = { path = "../../Repos/game-utils/crates/game-utils" }
# game-utils-repame = { path = "../../Repos/game-utils/crates/game-utils-repame" }
# repame-audio = { path = "../../Repos/repame/crates/repame-audio" }
# repame-fx = { path = "../../Repos/repame/crates/repame-fx" }
# repame-shell = { path = "../../Repos/repame/crates/repame-shell" }
# repame-sim = { path = "../../Repos/repame/crates/repame-sim" }
# repose-app = { path = "../../Repos/repose/crates/repose-app" }
# repose-core = { path = "../../Repos/repose/crates/repose-core" }
# repose-material = { path = "../../Repos/repose/crates/repose-material" }
# repose-platform = { path = "../../Repos/repose/crates/repose-platform" }
# repose-text = { path = "../../Repos/repose/crates/repose-text" }
# repose-tree = { path = "../../Repos/repose/crates/repose-tree" }
# repose-ui = { path = "../../Repos/repose/crates/repose-ui" }
