name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: mlm-games/ci/.github/workflows/rust-app-ci.yml@main
    with:
      system-deps-linux: libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      run-clippy: false
      run-fmt: true
      run-test: true
      extra-checks: |
        --target wasm32-unknown-unknown --no-default-features
        --features physics
      include-android: true
      upload-artifacts: true
      app-slug: opensus

  ci-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - run: cargo check --features "dev,networking-native"
      - run: cargo clippy --all-targets --features "dev,networking-native" -- -D warnings
      - run: cargo test --features "dev,networking-native"
